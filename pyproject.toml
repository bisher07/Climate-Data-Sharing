[project]
name = "agent-prototype"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bisher07", email = "bisher.madi84@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.1",
    "langchain>=1.4.0",
    "langgraph>=1.2.11",
]

[project.scripts]
agent-prototype = "agent_prototype:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
